# The steps a CI run takes, held in one place.
#
# Windows and Linux each call this from a workflow file of their own, because a badge names a
# workflow file and nothing smaller. One file per operating system is what makes "Linux is
# broken, Windows is fine" readable from the README rather than only from the Actions tab.

name: Build and test

on:
  workflow_call:
    inputs:
      os:
        description: The runner to build and test on.
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # There is no global.json, deliberately: a local build uses whichever SDK is newest on
      # the machine, so that a break shows up as a break rather than being hidden by a pin.
      # A runner has nothing installed to be newest, so the requirement is stated here, and it
      # is the same one Directory.Build.props states as net10.0.
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
